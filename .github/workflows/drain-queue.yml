# Free 10-minute scheduler while Vercel is on Hobby (Hobby crons run at most
# once a day — vercel.json keeps a daily one as a backstop). Calls the same
# endpoint Vercel Cron would. Needs repo secrets APP_URL (e.g.
# https://weather-slip.vercel.app) and CRON_SECRET (same value as on Vercel).
#
# Caveats: GitHub may delay scheduled runs at busy times, and disables
# schedules after 60 days without commits on the repo. Once on Vercel Pro (or
# AWS), set vercel.json back to */10 and delete this workflow.
name: Drain weather queue

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/drain
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set yet — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/drain"
