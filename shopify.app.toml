# PRODUCTION app config (Partner app "Weather-Slip", linked 2026-10-12).
# Add a shopify.app.staging.toml (separate app + client_id) before launch —
# never share one client_id between environments (store-performance-monitor
# did, and `shopify app dev` overwrote its production URLs).
#
# WARNING: `shopify app config link` rewrites this whole file from the
# Partner Dashboard's current state — it dropped every webhook, the comments
# and automatically_update_urls_on_dev=false the first time (2026-10-12).
# After any link, `git diff` this file and restore before deploying.
name = "Weather-Slip"
client_id = "2f466274942e288153d61965b235f987"
application_url = "https://weather-slip.vercel.app"
embedded = true

[build]
include_config_on_deploy = true
# Must stay false: true lets `shopify app dev` silently replace the
# production application_url with a throwaway tunnel for as long as the dev
# session runs. Flip locally if you need it, never commit it as true.
automatically_update_urls_on_dev = false

[access_scopes]
# read_orders: order date, fulfillments and the shipping address's
#   city/zip/country/coordinates (Level 2 protected customer data — request
#   only the address field in the Partner Dashboard, not name/email/phone).
# write_orders: metafieldsSet on Order needs it.
# Shopify grants what's listed here, not what auth.begin asks for — a scope
# change does nothing until `shopify app deploy` pushes this file.
scopes = "read_orders,write_orders"

[auth]
redirect_urls = ["https://weather-slip.vercel.app/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/updated"]
  uri = "/webhooks/orders"

  # Mandatory for public apps.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"
